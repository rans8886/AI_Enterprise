[project]
name = "testcreator-mcp"
version = "0.1.0"
description = "TestCreator MCP - grounded test case retrieval and authoring over the VWO test case corpus"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp>=2.0",
]

[project.scripts]
testcreator-mcp = "testcreator_mcp.__main__:main"
testcreator-build-index = "testcreator_mcp.__main__:build_index_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testcreator_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
